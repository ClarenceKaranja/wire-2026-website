# Netlify reads this file when the GitHub repository is connected.
# The website lives in the "web" folder. The Sanity Studio (content editor) is
# built into the same site and served at /studio; editors sign in with Sanity.

# MOVING TO CLOUDFLARE: the site is now hosted on Cloudflare (see
# docs/cloudflare-deployment.md). Until NEW_SITE_URL is set, Netlify keeps
# building the full site as before. Once the Cloudflare site is live, set
# NEW_SITE_URL (e.g. https://wire2026.org, no trailing slash) in Netlify →
# Site configuration → Environment variables and redeploy: every old
# wire2026.netlify.app link then sends visitors to the same page there.
[build]
  base = "web"
  command = """
    if [ -n "$NEW_SITE_URL" ]; then
      rm -rf dist && mkdir -p dist &&
      printf '/*  %s/:splat  301!\n' "${NEW_SITE_URL%/}" > dist/_redirects &&
      echo "Redirect-only deploy to $NEW_SITE_URL";
    else
      npm run build:studio && npm run build;
    fi
  """
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys are marked "noindex" automatically
# (the build reads Netlify's CONTEXT variable), so search engines skip them.

# The Programme page was renamed Agenda on 30 October 2026. Old links
# (/programme, with or without a day anchor) go to the new address.
[[redirects]]
  from = "/programme"
  to = "/agenda"
  status = 301
  force = true

[[redirects]]
  from = "/programme/*"
  to = "/agenda"
  status = 301
  force = true

# The Resources page was renamed Downloads on 2 November 2026. Old links
# (/resources, with or without a section anchor such as #agenda) go to the new
# address; browsers keep the #anchor across the redirect. Document files are
# served by the Sanity CDN, so their links do not change.
[[redirects]]
  from = "/resources"
  to = "/downloads"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "/downloads"
  status = 301
  force = true
